async function prepareIcons(){icons=await fetch('/icons'+location.search).then(r=>r.json());await Promise.all(Object.keys(icons).map(key=>new Promise(resolve=>{const img=new Image();img.onload=()=>{if(key.startsWith('vehicle-'))icons[key]=colorVehicleIcon(img).toDataURL('image/png');else if(key.startsWith('game-')){const color=poiColors[key.slice(5,-4)];if(color){const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);const p=ctx.getImageData(0,0,c.width,c.height),rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16));for(let i=0;i<p.data.length;i+=4){const light=Math.max(p.data[i],p.data[i+1],p.data[i+2])/255;for(let j=0;j<3;j++)p.data[i+j]=Math.round(rgb[j]*light)}ctx.putImageData(p,0,0);icons[key]=c.toDataURL('image/png')}}resolve()};img.onerror=resolve;img.src=icons[key]})));draw()}

function spiceSize(item){return item.size||(/SpiceField_Large/i.test(item.class||'')?'large':/SpiceField_Medium/i.test(item.class||'')?'medium':'small')}
function layerFor(item){return ['ore','ore-area'].includes(item.kind)&&['titanium','stravidium'].includes(item.oreType)?'ore-'+item.oreType:item.kind==='spice'?'spice-'+spiceSize(item):item.kind==='reference'?'ref-'+item.referenceType:item.kind}
function iconFor(item){if(['ore-titanium','ore-stravidium'].includes(item.kind))return 'game-'+item.kind.slice(4)+'.png';const ref=item.referenceType||item.kind.replace('ref-','');if(['testing-station','cave','taxi-service','titanium','stravidium'].includes(ref))return 'game-'+({'testing-station':'lab','taxi-service':'taxi'}[ref]||ref)+'.png';if(item.kind.startsWith('spice'))return 'spice-marker.svg';if(item.kind==='worm')return 'live-worm.png';if(item.kind==='wreck')return 'game-wreck.png';if(item.kind==='crash')return 'game-encounter.png';if(item.kind==='storm'||item.kind==='storm-history')return 'wind.svg';if(item.kind==='ore'||item.kind==='ore-area')return icons['game-'+item.oreType+'.png']?'game-'+item.oreType+'.png':'game-ore.png';let c=(item.class||'').toLowerCase();return 'vehicle-'+(c.includes('sandbike')?'sandbike':c.includes('treadwheel')?'treadwheel':c.includes('buggy')?'buggy':c.includes('harvester')||c.includes('sandcrawler')?'sandcrawler':c.includes('medium')?'assault':c.includes('transport')?'carrier':'scout')+'.png'}
function stormHull(points){points.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]),lower=[],upper=[];for(const p of points){while(lower.length>1&&cross(lower.at(-2),lower.at(-1),p)<=0)lower.pop();lower.push(p)}for(const p of points.slice().reverse()){while(upper.length>1&&cross(upper.at(-2),upper.at(-1),p)<=0)upper.pop();upper.push(p)}return lower.slice(0,-1).concat(upper.slice(0,-1))}
function drawStormFootprint(storm){const current=[],swept=[],end=storm.fields?.m_EndLocation,delta=end?[(end.x-storm.location.x)/2438400*900,(end.y-storm.location.y)/2438400*900]:[0,0];for(const z of storm.zones||[]){if(!z.warning&&!z.damaging)continue;const values=[z.location?.x,z.location?.y,z.rotation?.yaw,z.rotation?.pitch,z.rotation?.roll,z.scale?.x,z.scale?.y,z.widthMeters,z.lengthMeters];if(!values.every(Number.isFinite)||Math.abs(z.rotation.pitch)>.001||Math.abs(z.rotation.roll)>.001||z.scale.x<=0||z.scale.y<=0)continue;const a=z.rotation.yaw*Math.PI/180,c=Math.cos(a),sn=Math.sin(a),rx=50*z.scale.x/2438400*900,ry=50*z.scale.y/2438400*900,cx=(z.location.x+1270000)/2438400*900,cy=(z.location.y+1270000)/2438400*900;for(let i=0;i<48;i++){const t=i/48*Math.PI*2,x=rx*Math.cos(t),y=ry*Math.sin(t),p=[cx+x*c-y*sn,cy+x*sn+y*c];current.push(p);swept.push(p,[p[0]+delta[0],p[1]+delta[1]])}}if(!current.length)return;const path=points=>'M'+stormHull(points).map(p=>p.join(' ')).join('L')+'Z';node('path',{d:path(swept),fill:'#e5edf5','fill-opacity':.10,stroke:'#f3eee2','stroke-opacity':.65,'stroke-width':1.25*camera.w/948,'data-storm-swept':'true',style:'pointer-events:none'});node('path',{d:path(current),fill:'#e5edf5','fill-opacity':.17,'data-storm-footprint':'true',style:'pointer-events:none'})}
let stormFocused=false;let camera={x:-24,y:-24,w:948,h:948};function applyCamera(){svg.setAttribute('viewBox',[camera.x,camera.y,camera.w,camera.h].join(' '));draw()}
let hitMarkers=[];function draw(){hitMarkers=[];svg.replaceChildren();node('image',{href:'/terrain.webp'+location.search,x:0,y:0,width:900,height:900,preserveAspectRatio:'none'});for(let i=0;i<=9;i++){let p=i*100;node('path',{d:`M${p} 0V900 M0 ${p}H900`,stroke:'#342d24','stroke-opacity':.5,'stroke-width':1});if(i<9){for(let col=0;col<9;col++)node('text',{x:col*100+7,y:p+15,style:'fill:#f0ddba;fill-opacity:.75;font:12px system-ui;pointer-events:none'}).textContent='IHGFEDCBA'[i]+(col+1)}}
const definitions=node('defs',{}),clip=node('clipPath',{id:'world-clip'},definitions);node('rect',{x:0,y:0,width:900,height:900},clip);

for(const storm of state.items.filter(i=>i.kind==='storm'&&enabled.has('storm'))){drawStormFootprint(storm);const a=storm.fields?.m_StartLocation,b=storm.fields?.m_EndLocation;if(a&&b&&[a.x,a.y,b.x,b.y].every(Number.isFinite)){node('path',{d:`M${(storm.location.x+1270000)/2438400*900} ${(storm.location.y+1270000)/2438400*900}L${(b.x+1270000)/2438400*900} ${(b.y+1270000)/2438400*900}`,fill:'none',stroke:'#e49161','stroke-width':3*camera.w/948,'stroke-opacity':.8,'stroke-dasharray':'10 7','marker-end':'url(#storm-arrow)','data-storm-route':'true'});}}
const cell=64/Math.max(.01,svg.getScreenCTM().a),bins=[],displayItems=[],oreSeen=new Set();
for(const item of state.items){if(item.kind!=='ore'){displayItems.push(item);continue}const identity=(item.oreType||'ore')+':'+[item.location.x,item.location.y,item.location.z].map(v=>Number(v||0).toFixed(2)).join(':');if(oreSeen.has(identity))continue;oreSeen.add(identity);const px=(item.location.x+1270000)/2438400*900,py=(item.location.y+1270000)/2438400*900;let bin=bins.find(b=>b.clusterType===(item.oreType||'ore')&&Math.hypot(px-b.px/b.count,py-b.py/b.count)<cell);if(!bin){bin={...item,currentlyObserved:false,lastSeen:0,clusterType:item.oreType||'ore',oreType:null,count:0,oreCounts:{},px:0,py:0,location:{x:0,y:0,z:0}};bins.push(bin)}bin.currentlyObserved ||= item.currentlyObserved===true;bin.lastSeen=Math.max(bin.lastSeen,item.lastSeen||0);bin.count++;bin.oreCounts[item.oreType||'Ore']=(bin.oreCounts[item.oreType||'Ore']||0)+1;bin.px+=px;bin.py+=py;bin.location.x+=item.location.x;bin.location.y+=item.location.y;bin.location.z+=item.location.z||0}
for(const bin of bins){for(const k of ['x','y','z'])bin.location[k]/=bin.count;let types=Object.keys(bin.oreCounts);bin.oreType=types.length===1?types[0]:null;displayItems.push(bin)}
displayItems.sort((a,b)=>(a.kind==='vehicle'?2:a.kind==='reference'?0:1)-(b.kind==='vehicle'?2:b.kind==='reference'?0:1));
if(enabled.has('storm-history'))for(const pass of state.stormPasses||[]){if(!pass.completedAt||!pass.points?.length)continue;const last=pass.points.at(-1),profile=pass.profile;if(profile?.zones?.length)drawStormFootprint({...profile,fields:{...profile.fields,m_EndLocation:last}});node('polyline',{points:pass.points.map(p=>[(p.x+1270000)/2438400*900,(p.y+1270000)/2438400*900].join(',')).join(' '),fill:'none',stroke:'#9ec9dd','stroke-width':3*camera.w/948,'stroke-opacity':.85,'data-storm-history':'true',style:'pointer-events:none'})}
for(const track of state.tracks||[]){if(!enabled.has(track.kind)||track.points.length<2)continue;const points=track.points.map(p=>[(p.x+1270000)/2438400*900,(p.y+1270000)/2438400*900].join(',')).join(' ');node('polyline',{points,fill:'none',stroke:track.kind==='storm'?'#e49161':'#c3dfad','stroke-width':3*camera.w/948,'stroke-opacity':.8,'stroke-dasharray':track.kind==='storm'?'8 5':'none','data-track':track.kind});}
for(let item of displayItems){if(!enabled.has(layerFor(item)))continue;let x=(item.location.x+1270000)/2438400*900,y=(item.location.y+1270000)/2438400*900;const incoming=x<0||x>900||y<0||y>900;if(incoming&&item.kind!=='storm')continue;if(incoming&&!stormFocused){x=Math.max(8,Math.min(892,x));y=Math.max(8,Math.min(892,y));}
let large=item.kind==='spice'&&spiceSize(item)==='large',medium=item.kind==='spice'&&spiceSize(item)==='medium',label=item.kind==='ore-area'?item.oreType+' deposit area (unscanned)':large?'Large spice field':medium?'Medium spice field':item.kind==='spice'?'Small spice field':item.kind==='reference'?labels[kinds.indexOf(layerFor(item))]:item.kind==='wreck'?'Shipwreck':item.kind==='crash'?'Crashed ship event':item.oreType||(incoming?'Incoming storm':labels[kinds.indexOf(item.kind)]);
let size=large?60:medium?32:item.kind==='spice'?20:item.kind==='reference'?18:item.kind==='ore-area'?44:item.kind==='ore'?(['titanium','stravidium'].includes(item.oreType)?34:24):item.kind==='worm'?46:item.kind==='vehicle'?56:30;size*=camera.w/948;const actualX=x,actualY=y;let n=node('g',{'data-id':item.id||'', 'data-kind':item.kind,'data-ore-type':item.oreType||'','data-size':large?'large':medium?'medium':'small',style:'cursor:help'});if(item.kind==='ore-area')node('circle',{cx:x,cy:y,r:size*.6,fill:'none',stroke:'#e6cf97','stroke-width':1.5*camera.w/948,'stroke-dasharray':'4 3'},n);node('image',{href:icons[iconFor(item)],x:x-size/2,y:y-size/2,width:size,height:size,preserveAspectRatio:'xMidYMid meet',style:(large||item.kind==='vehicle')?'filter:drop-shadow(0 0 4px #000) drop-shadow(0 0 2px #f1dba8)':'filter:drop-shadow(0 0 2px #000)'},n);if(item.kind==='ore'&&item.count>1){node('text',{x:x+size*.35,y:y-size*.3,style:'fill:#fff;font:bold '+(12*camera.w/948)+'px system-ui;paint-order:stroke;stroke:#161b22;stroke-width:'+3*camera.w/948+';pointer-events:none'}).textContent=item.count}hitMarkers.push({x,y,actualX,actualY,size,item,label:item.kind==='vehicle'?vehicleLabel(item):item.kind==='worm'?'Sandworm':item.name&&item.source==='solo-reference'?item.name:label});}
kinds.forEach((k,i)=>{let row=document.querySelector('#layers [data-layer="'+k+'"]');if(!row){row=document.createElement('label');row.dataset.layer=k;let input=document.createElement('input');input.type='checkbox';input.onchange=()=>{input.checked?enabled.add(k):enabled.delete(k);draw()};let image=document.createElement('img');image.alt='';let caption=document.createElement('div');caption.textContent=labels[i];let count=document.createElement('span');row.append(input,image,caption,count);document.querySelector('#layers').append(row)}row.querySelector('input').checked=enabled.has(k);row.querySelector('img').src=icons[iconFor({kind:k})]||'';const areaCount=state.items.filter(p=>p.kind==='ore-area'&&layerFor(p)===k).length;row.querySelector('span').textContent=k==='storm-history'?(state.stormPasses||[]).filter(p=>p.completedAt).length:state.items.filter(p=>p.kind!=='ore-area'&&layerFor(p)===k).length+(areaCount?' + '+areaCount+(areaCount===1?' area':' areas'):'');})}

async function refresh(){try{let r=await fetch('/state'+location.search,{cache:'no-store'});if(!r.ok)throw Error();state=await r.json();document.querySelector('#status').textContent=state.status;document.querySelector('#time').textContent=state.capturedAt?'Captured '+new Date(state.capturedAt*1000).toLocaleTimeString():'';draw();renderVehicleDetails();const storms=state.items.filter(i=>i.kind==='storm'),notice=document.querySelector('#storm-notice');notice.hidden=!storms.length||!enabled.has('storm');notice.textContent=storms.map(i=>'Active storm'+(Number.isFinite(i.fields?.m_LifeTimeRemaining)?'  -  '+Math.ceil(i.fields.m_LifeTimeRemaining/60)+' min remaining':'')).join('\n')}catch{document.querySelector('#status').textContent='Capture unavailable'}}
function vehicleLabel(item){let c=(item.class||'').toLowerCase();return c.includes('sandbike')?'Sandbike':c.includes('treadwheel')?'Treadwheel':c.includes('buggy')?'Buggy':c.includes('medium')?'Assault ornithopter':c.includes('transport')?'Carrier ornithopter':c.includes('light')?'Scout ornithopter':'Vehicle'}
const hoverCard=document.querySelector('#hover-card');
function showHover(event){if(drag){hoverCard.hidden=true;return}let p=mapPoint(event),hits=hitMarkers.filter(m=>Math.abs(m.x-p.x)<=m.size/2+3&&Math.abs(m.y-p.y)<=m.size/2+3);if(!hits.length){hoverCard.hidden=true;return}let groups=new Map();for(let m of hits){let col=Math.floor(m.actualX/100)+1,row=Math.floor(m.actualY/100),sector=(row>=0&&row<9?'IHGFEDCBA'[row]:'?')+col,key=m.label+'  -  '+sector;if(m.item.oreCounts){for(const [ore,count] of Object.entries(m.item.oreCounts)){let k=ore+'  -  '+sector+(m.item.currentlyObserved===false?' (saved scan)':'');groups.set(k,(groups.get(k)||0)+count)}}else {if(m.item.kind==='vehicle'&&Number.isFinite(m.item.fuel)&&m.item.fuelCapacity>0)key+=' - Fuel '+Math.round(100*m.item.fuel/m.item.fuelCapacity)+'% (saved)';groups.set(key,(groups.get(key)||0)+(m.item.count||1))}}hoverCard.textContent=[...groups].map(([label,count])=>label+(count>1?'  -  '+count:'')).join('\n');hoverCard.hidden=false;let rect=hoverCard.getBoundingClientRect();hoverCard.style.left=Math.max(8,Math.min(event.clientX+16,innerWidth-rect.width-8))+'px';hoverCard.style.top=Math.max(8,Math.min(event.clientY+16,innerHeight-rect.height-8))+'px'}
svg.addEventListener('pointermove',showHover);svg.addEventListener('pointerleave',()=>hoverCard.hidden=true);
let selectedVehicleIds=[];
function renderVehicleDetails(){let panel=document.querySelector('#vehicle-details'),cards=document.querySelector('#vehicle-cards');if(!selectedVehicleIds.length){panel.hidden=true;return}panel.hidden=false;cards.replaceChildren();for(let id of selectedVehicleIds){let item=state.items.find(p=>p.kind==='vehicle'&&p.id===id),card=document.createElement('section');card.style.cssText='padding:12px 0;border-top:1px solid #4a4640';if(!item){card.textContent='Vehicle no longer in the current capture';cards.append(card);continue}let title=document.createElement('strong');title.textContent=item.customName||vehicleLabel(item);card.append(title);let x=(item.location.x+1270000)/2438400*9,y=(item.location.y+1270000)/2438400*9,row=Math.floor(y),sector=(row>=0&&row<9?'IHGFEDCBA'[row]:'?')+(Math.floor(x)+1);for(let text of [vehicleLabel(item)+' - '+sector,...(Number.isFinite(item.fuel)&&Number.isFinite(item.fuelCapacity)&&item.fuelCapacity>0?['Fuel '+Math.round(100*item.fuel/item.fuelCapacity)+'% (saved '+new Date(item.fuelSavedAt*1000).toLocaleTimeString()+')']:[]),'X '+Math.round(item.location.x)+' / Y '+Math.round(item.location.y)+' / Z '+Math.round(item.location.z||0),state.status+' - '+new Date(state.capturedAt*1000).toLocaleTimeString()]){let line=document.createElement('div');line.style.cssText='font-size:13px;color:#ccc;margin-top:7px';line.textContent=text;card.append(line)}cards.append(card)}}
document.querySelector('#close-details').onclick=()=>{selectedVehicleIds=[];renderVehicleDetails()};
svg.addEventListener('click',event=>{if(suppressClick)return;let p=mapPoint(event),hits=hitMarkers.filter(m=>m.item.kind==='vehicle'&&Math.abs(m.x-p.x)<=m.size/2+4&&Math.abs(m.y-p.y)<=m.size/2+4);if(hits.length){selectedVehicleIds=hits.map(m=>m.item.id);hoverCard.hidden=true;renderVehicleDetails()}});
svg.style.touchAction='none';svg.style.cursor='grab';
function mapPoint(event){return new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse())}
svg.addEventListener('wheel',event=>{event.preventDefault();const p=mapPoint(event),scale=event.deltaY<0?0.85:1/0.85,w=Math.max(118.5,Math.min(2400,camera.w*scale)),factor=w/camera.w;camera={x:p.x-(p.x-camera.x)*factor,y:p.y-(p.y-camera.y)*factor,w,h:w};applyCamera()},{passive:false});
let suppressClick=false;let drag=null;svg.addEventListener('dragstart',e=>e.preventDefault());svg.addEventListener('selectstart',e=>e.preventDefault());svg.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();window.getSelection()?.removeAllRanges();suppressClick=false;drag={id:event.pointerId,x:event.clientX,y:event.clientY,camera:{...camera},scale:svg.getScreenCTM().a};svg.setPointerCapture(event.pointerId);svg.style.cursor='grabbing'});
svg.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.id)return;event.preventDefault();const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.hypot(dx,dy)>4)suppressClick=true;camera.x=drag.camera.x-dx/drag.scale;camera.y=drag.camera.y-dy/drag.scale;applyCamera()});
function release(event){if(drag&&svg.hasPointerCapture(drag.id))svg.releasePointerCapture(drag.id);drag=null;svg.style.cursor='grab'}svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',release);
document.querySelector('#reset').onclick=()=>{stormFocused=false;camera={x:-24,y:-24,w:948,h:948};applyCamera()};
document.querySelector('#storm-fit').onclick=()=>{const points=state.items.filter(i=>i.kind==='storm').flatMap(i=>[i.location,i.fields?.m_StartLocation,i.fields?.m_EndLocation]).filter(p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y));if(!points.length&&enabled.has('storm-history'))points.push(...(state.stormPasses||[]).filter(p=>p.completedAt).flatMap(p=>p.points));if(!points.length)return;const xs=[0,900,...points.map(p=>(p.x+1270000)/2438400*900)],ys=[0,900,...points.map(p=>(p.y+1270000)/2438400*900)],x=Math.min(...xs)-50,y=Math.min(...ys)-50,w=Math.max(Math.max(...xs)-x,Math.max(...ys)-y)+50;stormFocused=true;camera={x,y,w,h:w};applyCamera()};
document.querySelector('#layers-toggle').onclick=()=>{const panel=document.querySelector('#panel');panel.hidden=!panel.hidden;document.body.classList.toggle('layers-hidden',panel.hidden);document.querySelector('#layers-toggle').setAttribute('aria-expanded',!panel.hidden);draw()};
function fitHeader(){document.documentElement.style.setProperty('--map-top',Math.ceil(document.querySelector('header').getBoundingClientRect().bottom+12)+'px')}new ResizeObserver(fitHeader).observe(document.querySelector('header'));window.addEventListener('resize',fitHeader);fitHeader();
document.querySelector('#expand').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.querySelector('main').requestFullscreen();prepareIcons().then(refresh).catch(()=>document.querySelector('#status').textContent='Map assets unavailable');setInterval(refresh,3000);
</script></html>
