version: 2

# Dependency update automation. Monthly cadence so bumps batch into release
# cycles instead of trickling in continuously; minor +
# patch bumps are grouped into a single PR per ecosystem/directory so routine
# updates don't fan out into dozens of separate PRs. Major bumps stay
# individual so they can be reviewed on their own.
updates:
  # --- npm: web portal (React + Vite) ---
  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      webui-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Runtime/CI stay on Node 22. Keep declarations on that major until the
      # actual runtime is intentionally upgraded.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      # typescript-eslint currently requires TypeScript <6.1.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # --- npm: marketing site (Astro) ---
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      site-minor-patch:
        update-types: [minor, patch]

  # --- npm: mobile app ---
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]

  # --- NuGet: WebView2 desktop shell ---
  - package-ecosystem: nuget
    directory: /app/desktop/DuneShell
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      duneshell-minor-patch:
        update-types: [minor, patch]

  # --- NuGet: Friend Helper console ---
  - package-ecosystem: nuget
    directory: /helper/friend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      friend-helper-minor-patch:
        update-types: [minor, patch]

  # --- GitHub Actions used by the workflows ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
