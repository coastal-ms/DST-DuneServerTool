name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge is deliberately narrow: npm patch bumps only.
      #
      # CI runs tests, lint and scans, but it never builds the installer and
      # never launches the WebView2 desktop shell, so green checks cannot prove
      # a NuGet or desktop-shell bump is safe. Those ecosystems always require a
      # human plus an installer build. Minor bumps are excluded for the same
      # reason: they can change runtime behaviour that the test suite does not
      # cover.
      - name: Enable auto-merge for npm patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.package-ecosystem == 'npm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
