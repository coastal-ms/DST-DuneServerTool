name: Redirect old GitHub Pages website

# Publishes redirects from the former marketing website to duneservertool.com.
# Final URL: https://coastal-ms.github.io/DST-DuneServerTool/
#
# Triggers:
#   - push to main (only when files that affect the site change)
#   - any release publish (so the Download button picks up the new tag)
#   - manual run from the Actions tab

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "docs/img/**"
      - ".github/workflows/deploy-site.yml"
  # This trigger was previously removed because the release run collided with
  # the in-flight CHANGELOG push run and the github-pages environment rejected
  # the second deploy. The concurrency block below now cancels the in-flight run
  # instead, so the later release-triggered deploy wins and publishes the new
  # version.
  release:
    types: [published]
  workflow_dispatch:

# Allow only one deploy at a time; cancel in-progress runs on new pushes.
concurrency:
  # A prerelease event skips the jobs below, but workflow concurrency is
  # evaluated first. Keep that skipped mirror run in a separate group so it
  # cannot cancel the stable release deployment that started moments earlier.
  group: "pages-${{ github.event_name == 'release' && github.event.release.prerelease }}"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Stable publication refreshes the site. Silent test-channel mirrors are
    # prereleases and must not launch a redundant Pages deployment.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Build redirects to the primary website
        run: node site/scripts/build-redirects.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
