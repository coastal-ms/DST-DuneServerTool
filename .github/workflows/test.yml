name: Tests

# Runs the existing test suites that `Run-AllTests.ps1` already orchestrates
# locally, but which nothing in CI was executing (only `lint.yml` ran, and it
# only parse-checks + PSScriptAnalyzes dune-server.ps1). This wires up:
#   * the Pester 5 backend suite under tests/ (24 files)  -> job `pester`
#   * the Vitest webui suite under webui/tests/           -> job `vitest`
#
# Triggered on:
#   - pull_request to main: ALWAYS (no path filter). Same rationale as
#     lint.yml -- if these ever become required status checks, a path filter
#     would make PRs that don't touch the filtered paths wait forever on a
#     check that never runs. The jobs are cheap when there's nothing to test.
#   - push to main: filtered to the paths that actually affect test outcomes,
#     to keep CI minutes low on doc / site-only pushes.
on:
  push:
    branches: [main]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - 'tests/**'
      - 'app/**'
      - 'webui/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]

jobs:
  pester:
    name: PowerShell (Pester)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pester 5
        shell: pwsh
        # windows-latest usually ships Pester 5.x, but don't rely on it. If a
        # 5+ module isn't already available, install it with the same
        # resilience pattern lint.yml uses for PSScriptAnalyzer (PSResource v3
        # first, legacy Install-Module fallback, tolerate transient PSGallery
        # 403/429 + nuget.exe noise; success == the module imports).
        run: |
          $ErrorActionPreference = 'Continue'

          $have = Get-Module -ListAvailable -Name Pester |
              Where-Object {
                  $_.Version -ge [version]'5.0.0' -and
                  $_.ModuleBase -notlike "$env:USERPROFILE\*"
              }
          if ($have) {
              Write-Host "Pester $($have[0].Version) already available."
              return
          }

          $installed = $false
          if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
              for ($i = 1; $i -le 3 -and -not $installed; $i++) {
                  try {
                      Install-PSResource -Name Pester -Version '[5.5.0,)' -Scope AllUsers `
                          -TrustRepository -ErrorAction Stop
                      $installed = $true
                  } catch {
                      Write-Host "::warning::Install-PSResource attempt $i failed: $($_.Exception.Message)"
                      if ($i -lt 3) { Start-Sleep -Seconds ([Math]::Pow(2, $i)) }
                  }
              }
          }

          if (-not $installed) {
              try {
                  if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                      Register-PSRepository -Default -ErrorAction Stop
                  }
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
                  Install-Module Pester -MinimumVersion 5.5.0 -Scope AllUsers -Force -SkipPublisherCheck -ErrorAction Stop
              } catch {
                  Write-Host "::warning::Install-Module fallback failed: $($_.Exception.Message)"
              }
          }

          $ok = Get-Module -ListAvailable -Name Pester |
              Where-Object {
                  $_.Version -ge [version]'5.0.0' -and
                  $_.ModuleBase -notlike "$env:USERPROFILE\*"
              }
          if (-not $ok) { throw "Pester 5+ could not be made available." }
          Write-Host "Pester $($ok[0].Version) ready."

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build platform cache helper for Pester
        shell: pwsh
        run: |
          dotnet build app\tools\DunePlatformStore\DunePlatformStore.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Hosted runners grant the checkout to Administrators rather than the
          # user SID. Mirror the install's Users-readable executable ACL so the
          # helper's restricted same-user token can load its build output.
          $output = 'app\tools\DunePlatformStore\bin\Release'
          & icacls.exe $output /grant:r "${env:USERNAME}:(OI)(CI)RX" /T /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start disposable PostgreSQL fixture
        shell: pwsh
        run: |
          $bin = $env:PGBIN
          if (-not $bin -or -not (Test-Path (Join-Path $bin 'initdb.exe'))) {
              $bin = Get-ChildItem "$env:ProgramFiles\PostgreSQL" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object Name -Descending |
                  ForEach-Object { Join-Path $_.FullName 'bin' } |
                  Where-Object { Test-Path (Join-Path $_ 'initdb.exe') } |
                  Select-Object -First 1
          }
          if (-not $bin) { throw 'PostgreSQL server binaries are unavailable on this runner.' }

          $data = Join-Path $env:RUNNER_TEMP 'dst-inventory-postgres'
          $log = Join-Path $env:RUNNER_TEMP 'dst-inventory-postgres.log'
          $passwordFile = Join-Path $env:RUNNER_TEMP 'dst-inventory-postgres.pw'
          $superPassword = "$([guid]::NewGuid().ToString('N'))aA1!"
          $rolePassword = "$([guid]::NewGuid().ToString('N'))bB2!"
          Set-Content -LiteralPath $passwordFile -Value $superPassword -NoNewline
          try {
              & (Join-Path $bin 'initdb.exe') -D $data -A scram-sha-256 -U postgres `
                  "--pwfile=$passwordFile" --no-locale --encoding=UTF8
              $initExit = $LASTEXITCODE
          } finally {
              Remove-Item -LiteralPath $passwordFile -Force -ErrorAction SilentlyContinue
          }
          if ($initExit -ne 0) { exit $initExit }
          & (Join-Path $bin 'pg_ctl.exe') -D $data -l $log -o '-p 55439' start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:PGPASSWORD = $superPassword
          & (Join-Path $bin 'psql.exe') -h localhost -p 55439 -U postgres -d postgres `
              -v ON_ERROR_STOP=1 -c "CREATE ROLE dst_inventory LOGIN PASSWORD '$rolePassword' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bin 'psql.exe') -h localhost -p 55439 -U postgres -d postgres `
              -v ON_ERROR_STOP=1 -c 'CREATE DATABASE dst_inventory OWNER dst_inventory;'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:\PGPASSWORD

          "DST_TEST_POSTGRES_PSQL=$(Join-Path $bin 'psql.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DST_TEST_POSTGRES_PG_CTL=$(Join-Path $bin 'pg_ctl.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DST_TEST_POSTGRES_DATA=$data" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'PGHOST=localhost' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'PGPORT=55439' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'PGUSER=dst_inventory' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'PGDATABASE=dst_inventory' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PGPASSWORD=$rolePassword" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Pester suite
        shell: pwsh
        run: |
          $user = 'dst-pester'
          $passwordText = "$([guid]::NewGuid().ToString('N'))aA1!"
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          New-LocalUser -Name $user -Password $password -PasswordNeverExpires | Out-Null

          $profile = Join-Path $env:SystemDrive "Users\$user"
          $localAppData = Join-Path $profile 'AppData\Local'
          $temp = Join-Path $localAppData 'Temp'
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          & icacls.exe $profile /grant:r "${user}:(OI)(CI)F" /T /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & icacls.exe $env:GITHUB_WORKSPACE /grant:r "${user}:(OI)(CI)M" /T /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = (Get-Command pwsh).Source
          $start.ArgumentList.Add('-NoProfile')
          $start.ArgumentList.Add('-ExecutionPolicy')
          $start.ArgumentList.Add('Bypass')
          $start.ArgumentList.Add('-File')
          $start.ArgumentList.Add('tests\Run-Tests.ps1')
          $start.ArgumentList.Add('-CI')
          $start.WorkingDirectory = $env:GITHUB_WORKSPACE
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.LoadUserProfile = $true
          $start.Domain = $env:COMPUTERNAME
          $start.UserName = $user
          $start.Password = $password
          $start.Environment['USERPROFILE'] = $profile
          $start.Environment['LOCALAPPDATA'] = $localAppData
          $start.Environment['APPDATA'] = Join-Path $profile 'AppData\Roaming'
          $start.Environment['TEMP'] = $temp
          $start.Environment['TMP'] = $temp

          $process = [Diagnostics.Process]::Start($start)
          $stdout = $process.StandardOutput.ReadToEndAsync()
          $stderr = $process.StandardError.ReadToEndAsync()
          $process.WaitForExit()
          Write-Host $stdout.Result
          if ($stderr.Result) { Write-Host $stderr.Result }
          exit $process.ExitCode

      - name: Stop disposable PostgreSQL fixture
        if: always()
        shell: pwsh
        run: |
          if ($env:DST_TEST_POSTGRES_PG_CTL -and (Test-Path $env:DST_TEST_POSTGRES_PG_CTL) -and
              $env:DST_TEST_POSTGRES_DATA -and (Test-Path $env:DST_TEST_POSTGRES_DATA)) {
              & $env:DST_TEST_POSTGRES_PG_CTL -D $env:DST_TEST_POSTGRES_DATA -m fast stop
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: tests/TestResults.xml
          if-no-files-found: ignore

  vitest:
    name: WebUI (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install deps
        working-directory: webui
        run: npm ci

      - name: Run Vitest
        working-directory: webui
        run: npm test

  solo-helper:
    name: Solo database helper
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Audit, build, and self-test
        shell: pwsh
        run: |
          $project = 'app\tools\DuneSoloDb\DuneSoloDb.csproj'
          dotnet restore $project
          if ($LASTEXITCODE -ne 0) { throw 'DuneSoloDb restore failed.' }
          $audit = dotnet list $project package --include-transitive --vulnerable | Out-String
          Write-Host $audit
          if ($audit -match 'has the following vulnerable packages') {
            throw 'DuneSoloDb dependency audit found a vulnerable package.'
          }
          dotnet run --project $project -c Release -- --command self-test
          if ($LASTEXITCODE -ne 0) { throw 'DuneSoloDb self-test failed.' }
